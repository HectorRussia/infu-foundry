version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod:
        patterns:
          - "*"
