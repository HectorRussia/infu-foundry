openapi: 3.1.0
info:
  title: Infu Foundry API
  version: 0.9.0
  description: |
    Shared content library for signed-in users, with videos stored in Cloudflare R2.
    A content belongs to at most one shared category.
    Every route except /health and /auth/login needs the `infu_session` cookie.
    Writes must be JSON (other content types get 415). Through the Cloudflare Worker the
    gateway adds X-Gateway-Secret; direct calls to the Go host without it get 404.
servers:
  - url: /api/v1
    description: Same-origin Cloudflare gateway
  - url: http://localhost:8080/api/v1
    description: Local Go development server
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness without a database dependency
      security: []
      responses:
        '200':
          description: API is running
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: Gateway cannot reach a healthy backend

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, description: Case-insensitive }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: infu_session; Path=/api; HttpOnly; SameSite=Lax; Secure outside development; 30 days
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Wrong email or password }
        '429': { description: 10 failed attempts for this email within 15 minutes }
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session (send `{}` as the body)
      responses:
        '204': { description: Signed out; cookie cleared }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /contents:
    get:
      operationId: listContents
      summary: Non-deleted contents, most recently updated first (max 200)
      parameters:
        - name: category
          in: query
          required: false
          description: |
            Omit to list every content. `uncategorized` lists contents with no
            category. A category UUID lists that folder. An unknown UUID returns
            an empty list.
          schema:
            type: string
      responses:
        '200':
          description: Content summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: category is not a UUID and not `uncategorized` }
    post:
      operationId: createContent
      summary: Create content authored by the signed-in user
      requestBody: { $ref: '#/components/requestBodies/ContentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Empty title and body, or title over 300 characters }
  /contents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getContent
      responses:
        '200':
          description: Content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '404': { description: Missing, deleted or not a UUID }
    put:
      operationId: updateContent
      requestBody: { $ref: '#/components/requestBodies/ContentInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '404': { description: Missing or deleted }
        '422': { description: Invalid input }
    delete:
      operationId: deleteContent
      summary: Move to the trash (soft delete); cover and videos are kept
      responses:
        '204': { description: Deleted }
        '404': { description: Missing or already deleted }

  /categories:
    get:
      operationId: listCategories
      summary: Shared categories, ordered by name, with a count of live contents
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCategory
      summary: Create a shared category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, description: Trimmed; unique ignoring case }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Another category already uses this name }
        '422': { description: Blank name, or longer than 80 characters }
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: renameCategory
      summary: Rename a category; contents stay in it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, description: Trimmed; unique ignoring case }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { description: Missing or not a UUID }
        '409': { description: Another category already uses this name }
        '422': { description: Blank name, or longer than 80 characters }
    delete:
      operationId: deleteCategory
      summary: Delete a category without deleting or trashing its contents
      description: |
        Contents that were in the category become uncategorized. Their rows,
        covers and videos stay as they are. Trashing a content keeps the link,
        so restoring it brings the category back.
      responses:
        '204': { description: Deleted; its contents are now uncategorized }
        '404': { description: Missing or not a UUID }

  /trash:
    get:
      operationId: listTrash
      summary: Deleted contents, most recently deleted first (max 200); never purged automatically
      responses:
        '200':
          description: Trash
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrashedContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: emptyTrash
      summary: Permanently delete every content in the trash with its cover and videos
      responses:
        '204': { description: Trash emptied }
        '500': { description: An R2 delete failed; the remaining contents stay in the trash }
  /trash/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: restoreContent
      summary: Move a deleted content back to the library (send `{}` as the body)
      responses:
        '204': { description: Restored }
        '404': { description: Not in the trash }
  /trash/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: purgeContent
      summary: Permanently delete a content in the trash
      description: |
        Deletes the cover and every video object in R2 first, then the media and
        content rows in one transaction. Contents not in the trash are never purged.
      responses:
        '204': { description: Deleted for good }
        '404': { description: Not in the trash }
        '500': { description: An R2 delete failed; the content stays in the trash }

  /contents/{id}/cover:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: requestCoverUpload
      summary: Get a presigned R2 URL for a new cover image (PUT within 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, size]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size: { type: integer, minimum: 1, maximum: 10485760 }
      responses:
        '201':
          description: Upload URL issued
          content:
            application/json:
              schema:
                type: object
                required: [key, uploadUrl]
                properties:
                  key: { type: string, description: Pass back to PUT once uploaded }
                  uploadUrl: { type: string, format: uri }
        '404': { description: Content missing or deleted }
        '422': { description: Unsupported type or over 10 MB }
    put:
      operationId: setCover
      summary: Make an uploaded image the cover; the previous cover image is deleted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '200':
          description: Cover set; the crop starts centred (50, 50)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cover' }
        '409': { description: Image not uploaded yet }
        '422': { description: Key not issued for this content, or the object is not a valid image }
    patch:
      operationId: setCoverPosition
      summary: Choose which part of the cover stays visible when cards crop it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y]
              properties:
                x:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 100,
                    description: CSS object-position % (0 left,
                    100 right),
                  }
                y:
                  {
                    type: integer,
                    minimum: 0,
                    maximum: 100,
                    description: CSS object-position % (0 top,
                    100 bottom),
                  }
      responses:
        '200':
          description: Position saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cover' }
        '404': { description: Content missing or deleted }
        '422': { description: Missing or out-of-range x/y }
    delete:
      operationId: removeCover
      summary: Remove the cover and delete its image
      responses:
        '204': { description: Removed }
        '404': { description: Content missing or deleted }

  /contents/{id}/media:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: listContentMedia
      summary: Ready videos of a content with short-lived view URLs, oldest first
      responses:
        '200':
          description: Videos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MediaWithURL' }
    post:
      operationId: requestMediaUpload
      summary: Register a pending video and get a presigned R2 upload URL
      description: |
        PUT the file to `uploadUrl` within 15 minutes with exactly the declared
        Content-Type and size (both are signed), then call /media/{mediaId}/complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, size]
              properties:
                filename: { type: string, maxLength: 255 }
                contentType: { type: string, enum: [video/mp4, video/quicktime, video/webm] }
                size: { type: integer, minimum: 1, maximum: 1073741824 }
      responses:
        '201':
          description: Upload URL issued
          content:
            application/json:
              schema:
                type: object
                required: [media, uploadUrl]
                properties:
                  media: { $ref: '#/components/schemas/Media' }
                  uploadUrl: { type: string, format: uri }
        '404': { description: Content missing or deleted }
        '422': { description: Unsupported type, empty name or size over 1 GB }
  /media:
    get:
      operationId: listGallery
      summary: Ready videos of live contents with their content title, newest first (max 200)
      responses:
        '200':
          description: Gallery
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GalleryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /media/{mediaId}/complete:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    post:
      operationId: completeMediaUpload
      summary: Confirm the object exists in R2 with the declared size; marks it ready
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaWithURL' }
        '404': { description: Unknown or deleted media }
        '409': { description: Object not uploaded yet, or size differs }
  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    delete:
      operationId: deleteMedia
      summary: Delete the R2 object, then soft delete the record
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown or already deleted }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: infu_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    ContentInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, maxLength: 300, description: Trimmed }
              body: { type: string }
              categoryId:
                description: |
                  Omit on update to leave the category unchanged. Create stays
                  uncategorized when the field is omitted. null clears it. A UUID
                  assigns that shared category (422 when it does not exist).
                oneOf:
                  - type: string
                    format: uuid
                  - type: 'null'
  responses:
    Unauthorized:
      description: No valid session
  schemas:
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
    ContentSummary:
      type: object
      required:
        [id, authorName, videoCount, coverPositionX, coverPositionY, title, excerpt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        authorName: { type: string }
        videoCount: { type: integer, description: Ready, non-deleted videos }
        coverUrl:
          {
            type: string,
            format: uri,
            description: Presigned cover image URL (~1 hour); absent without a cover,
          }
        coverPositionX:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position x % (default 50),
          }
        coverPositionY:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position y % (default 50),
          }
        title: { type: string }
        excerpt: { type: string, description: First 160 characters of the body }
        updatedAt: { type: string, format: date-time }
        categoryId:
          { type: string, format: uuid, description: Absent when the content has no category }
        categoryName: { type: string, description: Absent when the content has no category }
    TrashedContent:
      type: object
      required:
        [id, authorName, title, excerpt, videoCount, deletedAt, coverPositionX, coverPositionY]
      properties:
        id: { type: string, format: uuid }
        authorName: { type: string }
        title: { type: string }
        excerpt: { type: string }
        videoCount: { type: integer }
        deletedAt: { type: string, format: date-time }
        coverUrl: { type: string, format: uri }
        coverPositionX: { type: integer }
        coverPositionY: { type: integer }
    Content:
      type: object
      required:
        [
          id,
          authorId,
          authorName,
          title,
          body,
          createdAt,
          updatedAt,
          coverPositionX,
          coverPositionY,
        ]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        coverUrl:
          {
            type: string,
            format: uri,
            description: Presigned cover image URL (~1 hour); absent without a cover,
          }
        coverDownloadUrl:
          {
            type: string,
            format: uri,
            description: Same as coverUrl but saved as a file named after the title; absent without a cover,
          }
        coverPositionX:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position x % (default 50),
          }
        coverPositionY:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position y % (default 50),
          }
        categoryId:
          { type: string, format: uuid, description: Absent when the content has no category }
        categoryName: { type: string, description: Absent when the content has no category }
    Category:
      type: object
      required: [id, name, contentCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentCount:
          {
            type: integer,
            description: Live contents in this category; trashed contents are not counted,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Cover:
      type: object
      required: [coverUrl, coverDownloadUrl, coverPositionX, coverPositionY]
      properties:
        coverUrl: { type: string, format: uri }
        coverDownloadUrl:
          { type: string, format: uri, description: R2 replies with Content-Disposition attachment }
        coverPositionX:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position x % (default 50),
          }
        coverPositionY:
          {
            type: integer,
            minimum: 0,
            maximum: 100,
            description: CSS object-position y % (default 50),
          }
    Media:
      type: object
      required: [id, contentId, uploaderId, filename, contentType, sizeBytes, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        contentId: { type: string, format: uuid }
        uploaderId: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [pending, ready] }
        createdAt: { type: string, format: date-time }
    GalleryItem:
      allOf:
        - $ref: '#/components/schemas/MediaWithURL'
        - type: object
          required: [contentTitle, uploaderName]
          properties:
            contentTitle: { type: string }
            uploaderName: { type: string }
    MediaWithURL:
      allOf:
        - $ref: '#/components/schemas/Media'
        - type: object
          required: [url, downloadUrl]
          properties:
            url: { type: string, format: uri, description: Presigned R2 GET, valid about 1 hour }
            downloadUrl:
              type: string
              format: uri
              description: Same as url but R2 replies with Content-Disposition attachment (original filename, RFC 6266) so phones save the file
